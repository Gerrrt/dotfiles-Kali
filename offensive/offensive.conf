# dotfiles-Offense/offensive/offensive.conf  ->  ~/.config/tmux/role.conf
# The OFFENSIVE role layer's tmux bits, linked by Core's blib_link_role_layer and
# sourced LAST by Core's tmux.conf (after tmux.reset.conf, this repo's Core, and the
# OS layer's os.conf).
#
# WHY LAST, AND WHY NOT os.conf. This binding used to live in os/kali.conf — an OS
# overlay — because Core had exactly one tmux overlay hook when it was written. That
# was wrong twice over: the OS overlay belongs to the OS-native repo (dotfiles-Debian
# now writes $CONFIG/tmux/os.conf for Kali), so both repos raced for the same path and
# the last bootstrap to run won; and os.conf is sourced BEFORE Core's own bindings, so
# any future Core `bind e` would silently take the key back. Core v4.13.1 added
# `source-file -q ~/.config/tmux/role.conf` at the end of tmux.conf precisely so a role
# layer's KEY BINDINGS land after everything else. See core/tmux/tmux.conf.
#
# Nothing else from the old os/kali.conf came with it: the battery and net-speed status
# probes are OS-native, and dotfiles-Debian's os/debian.conf already carries them.

# ── engagement popup (the offensive twin of Core's prefix+f sessionizer) ──────
# Bound only when the script is actually linked. bootstrap.sh gates that link on
# `blib_want tmux`, so `--skip tmux` / `--only …` would otherwise leave this binding
# pointing at a missing file: prefix+e opened a popup that immediately died with
# "no such file".
#
# $XDG_CONFIG_HOME-aware for the same reason bootstrap.sh is — it resolves
# CONFIG="${XDG_CONFIG_HOME:-$HOME/.config}", so a host with a custom XDG root had the
# link and the binding pointing at two different paths.
run-shell 'cfg="${XDG_CONFIG_HOME:-$HOME/.config}"; [ -e "$cfg/tmux/tmux-eng.sh" ] && tmux bind e display-popup -E -w 60% -h 70% "$cfg/tmux/tmux-eng.sh"'
