# dotfiles-Offense/os/kali.conf  ->  ~/.config/tmux/os.conf
# OS-native tmux layer, sourced by Core's tmux.conf. Per-OS status-line bits.

# Battery widget: off under WSL (no battery to report), on elsewhere. This used to be
# an unconditional `false` justified as "WSL has no battery" — true for the WSL2 target,
# but this repo also runs on bare-metal Kali, where it silently killed a working widget
# on a laptop. Detect rather than assume; the probe is the same one os/kali.zsh uses.
run-shell 'if [ -n "${WSL_DISTRO_NAME:-}" ] || grep -qiE "microsoft|wsl" /proc/version 2>/dev/null; then tmux set -g @batt_enable false; else tmux set -g @batt_enable true; fi'

# Network-speed widget watches the primary interface. Left at the "eth0" sentinel it
# AUTO-DERIVES the primary iface from the default route below (correct on WSL2, and on a
# mirrored-networking host-visible iface). To PIN one, set anything other than eth0 here —
# the auto-derive is then skipped.
set -g @netspeed_iface "eth0"
# Override the eth0 sentinel with the real default-route iface — ONLY while it's still
# "eth0" (so a pinned value above is respected). Covers IPv4 AND IPv6; portable
# (command -v guard + sed, busybox-safe); fails safe to eth0 when nothing found.
run-shell 'cur=$(tmux show -gv @netspeed_iface 2>/dev/null); [ "$cur" = "eth0" ] && command -v ip >/dev/null 2>&1 && i=$(ip -o route show default 2>/dev/null | sed -n "s/.* dev \([^ ]*\).*/\1/p" | head -1) && [ -n "$i" ] && tmux set -g @netspeed_iface "$i"'

# ── offensive layer: engagement popup (twin of Core's prefix+f sessionizer) ──
# Bound only when the script is actually linked. bootstrap.sh gates that link on
# `blib_want tmux`, so `--skip tmux` / `--only …` (and any future --no-offensive
# gating of the link) previously left this binding pointing at a missing file:
# prefix+e opened a popup that immediately died with "no such file".
#
# $XDG_CONFIG_HOME-aware for the same reason bootstrap.sh is — it resolves
# CONFIG="${XDG_CONFIG_HOME:-$HOME/.config}", so a host with a custom XDG root had
# the link and the binding pointing at two different paths.
run-shell 'cfg="${XDG_CONFIG_HOME:-$HOME/.config}"; [ -e "$cfg/tmux/tmux-eng.sh" ] && tmux bind e display-popup -E -w 60% -h 70% "$cfg/tmux/tmux-eng.sh"'
