# .github/workflows/routine-filter.yml
# ──────────────────────────────────────────────────────────────────────────────
# Regression gate for the routine filer's run-status classifier.
#
# .github/workflows/file-routine-issue.sh decides whether a scheduled routine's output is
# findings or a FAILED run, and files a failed run as a distinctly-titled advisory so a
# raw API error can never masquerade as an audit — or dedup into the findings issue. That
# guard silently stopped working once (issue #177: the API reworded its refusal and the
# single grep behind it went blind) and nothing in CI noticed, because a misclassified run
# is still a green run. test/check-routine-filter.sh drives the real helper end-to-end
# against both real refusal wordings, a genuine report that quotes one of them, and a
# generic failure; this job is what turns that into a gate.
#
# Its own workflow, not a step in lint.yml: lint.yml is a thin caller into dotfiles-core's
# reusable lint-call.yml and accepts exactly one input (extra_ls_files_excludes), so there
# is nowhere to add a repo-specific step without changing a fleet-wide workflow. Same shape
# as companion.yml instead — small, path-filtered, repo-owned.
# ──────────────────────────────────────────────────────────────────────────────
name: routine-filter

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/file-routine-issue.sh'
      - 'test/check-routine-filter.sh'
      - '.github/workflows/routine-filter.yml'
  pull_request:
    paths:
      - '.github/workflows/file-routine-issue.sh'
      - 'test/check-routine-filter.sh'
      - '.github/workflows/routine-filter.yml'
  workflow_dispatch:

concurrency:
  group: routine-filter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classifier:
    name: routine filer classifier (check-routine-filter)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No shellcheck step here on purpose: both scripts are repo-owned *.sh outside core/
      # and offensive/companion/, so lint.yml already shellchecks (and bash -n's) them with
      # the PINNED shellcheck from core/scripts/tool-versions.env. Duplicating it with the
      # runner's unpinned copy would only invite drift — this job just runs the gate.
      #
      # The test needs no GH_TOKEN and no issues: write permission: it stubs `gh` on PATH
      # and never reaches the network, so the job keeps the repo-default contents: read.
      - name: assert a blocked run is still classified as blocked
        run: ./test/check-routine-filter.sh
