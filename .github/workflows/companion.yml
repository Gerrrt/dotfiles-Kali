# .github/workflows/companion.yml
# ──────────────────────────────────────────────────────────────────────────────
# Drift gate for the structured companion's source-of-truth bridge.
#
# The `offensive/companion/entries/` are canonical for the paired red<->blue
# attack/detection slice; where that overlaps the flat field references
# (PURPLE-TEAM.md, later hacktheplanet), the overlapping blocks are GENERATED from
# the entries inside `<!-- companion:gen ID -->` markers. This job runs the
# generator in --check mode so a hand-edit to a generated block — or an entry
# edit that wasn't regenerated — fails CI instead of silently drifting (the exact
# drift the bridge exists to kill). Fix: run offensive/companion/gen-views.sh and
# commit the result.
# ──────────────────────────────────────────────────────────────────────────────
name: companion

# Unfiltered so it can be a REQUIRED check: a workflow skipped by `paths:` produces
# no check run, which leaves a required status pending forever. The job is a single
# script invocation of a few seconds, so running it on every PR costs nothing worth
# optimising — and the filter was a footgun anyway, since a change to gen-views.sh's
# own logic could shift every generated block without touching a listed path.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: companion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: companion view drift (gen-views --check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No shellcheck step here on purpose: gen-views.sh is repo-owned *.sh, so the
      # lint workflow already shellchecks it with the PINNED shellcheck from
      # core/scripts/tool-versions.env. Duplicating it with the runner's unpinned
      # shellcheck would only invite drift — this job just runs the drift gate.
      - name: assert generated views are in sync with their entries
        run: ./offensive/companion/gen-views.sh --check
