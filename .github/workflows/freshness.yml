name: freshness

# Consumer-side freshness watcher for the vendored core/ subtree — the sibling of
# companion-freshness.yml, and the workflow that file's own header has referred to
# ("mirrors this repo's core-freshness watcher (freshness.yml)") since before it
# existed.
#
# Core staleness IS already watched centrally: dotfiles-core runs fleet-drift.yml
# weekly across every consumer, and sync-fanout.yml opens a core.lock-bump PR here
# on each release. This is the belt to those braces, and it is the half that keeps
# working when the fleet job is broken, the App token has expired, or someone is
# looking at THIS repo and wants the answer from inside it.
#
# Scheduled an hour before the companion watcher (07:00 vs 08:00) so the two never
# contend, matching the ordering companion-freshness.yml documents.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendored-core:
    # Scheduled runs fire on every fork with Actions enabled; gate on the owner so a
    # fork's clock doesn't burn minutes (and email a red run) on a watcher that only
    # matters for the canonical repo. workflow_dispatch from a fork still no-ops cleanly.
    if: github.repository_owner == 'dotgibson'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # core.lock is the fast path, but keep full history in step with the
          # companion watcher so both can reason about how far behind they are.
          fetch-depth: 0

      - name: Check vendored core/ against upstream dotfiles-core
        run: |
          # 0 = current/skip, 2 = behind (the nudge), 1 = hard failure (malformed
          # core.lock). `|| rc=$?` keeps the step's set -e from aborting before we branch.
          rc=0
          out="$(./test/check-core-freshness.sh 2>&1)" || rc=$?
          printf '%s\n' "$out"
          case "$rc" in
            0)
              {
                echo "### ✅ vendored core/ freshness"
                echo ""
                echo '```'
                printf '%s\n' "$out"
                echo '```'
              } >>"$GITHUB_STEP_SUMMARY"
              ;;
            2)
              {
                echo "### ⚠️ vendored core/ is behind upstream dotfiles-core"
                echo ""
                echo '```'
                printf '%s\n' "$out"
                echo '```'
                echo ""
                echo "Pull Core, then re-run the gates:"
                echo ""
                echo '```'
                echo "scripts/sync-core.sh"
                echo "make lint && make test"
                echo '```'
                echo ""
                echo "If a \`core.lock\`-bump PR from the fleet sync is already open, merge that instead."
              } >>"$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            *)
              {
                echo "### ❌ core-freshness check failed (exit $rc)"
                echo ""
                echo '```'
                printf '%s\n' "$out"
                echo '```'
              } >>"$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
