# .github/workflows/bootstrap.yml
# Thin caller for the reusable bootstrap test authored in dotfiles-core. The logic
# lives there (one place for the whole fleet); this just names Kali's container +
# the deps bootstrap needs, and sets offensive: true so the reusable test also
# asserts the offensive role layer (symlinks + the `offensive` loader stage).
# See dotfiles-core/.github/workflows/bootstrap-test.yml.
name: bootstrap

# NO PATH FILTER, deliberately — two reasons.
#
# 1. A workflow skipped by `paths:` produces no check run, so requiring it would
#    hang every non-matching PR on "Expected — waiting for status".
# 2. The filter was already incomplete and silently so: it listed bootstrap.sh,
#    core/, os/, ssh/ and offensive/ but NOT install/ or wsl/ — both of which
#    bootstrap.sh reads (install/packages.txt, install/tool-versions.env,
#    wsl/wsl.conf). Editing a package list therefore did not re-run the bootstrap
#    test. Rather than keep chasing the list as bootstrap grows new inputs, run it
#    on every PR; it is a container job of a few minutes and it is the single
#    highest-value gate in the repo.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: dotgibson/dotfiles-core/.github/workflows/bootstrap-test.yml@v4
    with:
      image: kalilinux/kali-rolling
      prep: "apt-get update -qq && apt-get install -y -qq bash zsh"
      offensive: true
